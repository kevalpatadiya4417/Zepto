<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zepto</title>
    <link
      rel="shortcut icon"
      href="./Assets/zepto fav.webp"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <section class="nav-left">
        <div class="logo">
          <img src="./Assets/Zepto logo.svg" alt="Zepto logo" />
        </div>
        <div class="add">
          <p>
            <i class="fa-solid fa-bolt"></i>
            Delivery in minutes*
          </p>
        </div>
        <div class="search-bar">
          <p>
            <i class="fa-solid fa-magnifying-glass"></i>
            search for
          </p>
        </div>
        <div class="login">
          <p>
            <i class="fa-regular fa-circle-user"></i>
            <br />
            login
          </p>
        </div>
        <div class="cart">
          <p>
            <i class="fa-solid fa-cart-shopping"></i>
            <br />
            cart
          </p>
        </div>
      </section>

      <!-- <hr class="line" />   -->

      <section>
        <div class="necessitys">
          <div class="all">
            <i class="fa-solid fa-bag-shopping"></i>
            <p>All</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-mug-saucer"></i>
            <p>Cafe</p>
          </div>
          <div class="all">
            <i class="fa-regular fa-house"></i>
            <p>Home</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-truck-monster"></i>
            <p>Toy</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-apple-whole"></i>
            <p>Fresh</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-plug"></i>
            <p>Electroics</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <p>Mobils</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <p>Beauty</p>
          </div>
          <div class="all">
            <i class="fa-solid fa-capsules"></i>
            <p>Pharmacy</p>
          </div>
        </div>
      </section>

      <section>
        <div>
          <img class="main-banner" src="./Assets/main banner.webp" alt="" />
        </div>
      </section>

      <section>
        <div class="category">
          <h2>Shop by Category</h2>
          <p class="cat">See all</p>
        </div>
        <div class="category-1">
          <div class="photos">
            <img src="./Assets/Category/Fruits.webp" alt="Fruits" />
            <p>Fruits & Vegitables</p>
          </div>
          <div class="photos">
            <img src="./Assets/Category/Dairy.webp" alt="Dairy" />
            <p>Dairy, Bread & Eggs</p>
          </div>
          <div class="photos">
            <img src="./Assets/Category/Atta.webp" alt="Atta" />
            <p>Atta, Rise, Oil & Dals</p>
          </div>
          <div class="photos">
            <img src="./Assets/Category/meats.webp" alt="meats" />
            <p>Meats, Fish & Eggs</p>
          </div>
          <div class="photos">
            <img src="" alt="" />
            <p></p>
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
