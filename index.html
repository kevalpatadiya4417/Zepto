<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zepto</title>
    <link
      rel="shortcut icon"
      href="./Assets/zepto fav.webp"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <section class="nav-left">
        <div class="logo">
          <img src="./Assets/Zepto logo.svg" alt="Zepto logo" />
        </div>
        <div class="add">
          <p>
            <i class="fa-solid fa-bolt"></i>
            Delivery in minutes*
          </p>
        </div>
        <div class="search-bar">
          <p>
            <i class="fa-solid fa-magnifying-glass"></i>
            search for
          </p>
        </div>
        <div class="login">
          <p>
            <i class="fa-regular fa-circle-user"></i>
            <br />
            login
          </p>
        </div>
        <div class="cart">
          <p>
            <i class="fa-solid fa-cart-shopping"></i>
            <br />
            cart
          </p>
        </div>
      </section>
      <!-- <hr class="line" />   -->

      <section class="necessitys">
        <div>
          <img class="images" src="./Assets/All/bag.png" alt="bag" />
          Bag
        </div>
      </section>
    </header>
  </body>
</html>
